[project]
name = "example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["savitar"]

[tool.uv.sources]
savitar = { path = "..", editable = true }

[tool.savitar]
web = "web"      # frontend folder
dev = false      # false = serve a prebuilt frontend (`savitar build`); true = watch + rebuild
packages = ["blockly", "axios"]    # extra JS packages, managed by `savitar pkg add/remove`
